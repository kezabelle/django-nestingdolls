repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: make ruff
        language: system
        pass_filenames: false
        files: ^(.*\.py|pyproject\.toml)$
      - id: ruff-format
        name: Ruff format
        entry: make formatcheck
        language: system
        pass_filenames: false
        files: ^(.*\.py|pyproject\.toml)$
      - id: tscheck
        name: TypeScript type check
        entry: make tscheck
        language: system
        pass_filenames: false
        files: ^(nestingdolls/static/nestingdolls/.*\.ts|package(-lock)?\.json|tsconfig\.json)$
      - id: jsdrift
        name: Compiled JavaScript drift
        entry: make jsdrift
        language: system
        pass_filenames: false
        files: ^(nestingdolls/static/nestingdolls/.*\.ts|package(-lock)?\.json|tsconfig\.json)$
      - id: jstest
        name: JavaScript DOM tests
        entry: make jstest
        language: system
        pass_filenames: false
        files: ^(nestingdolls/static/nestingdolls/.*\.(ts|js)|test_sequence\.mjs|package(-lock)?\.json|tsconfig\.json)$
