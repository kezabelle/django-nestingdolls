[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-nesting-dolls"
version = "1.0.0"
description = "Composite Django form fields for nested mappings and sequences."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Keryn Knight", email = "keryn@kerynknight.com" }]
keywords = ["django", "forms", "formsets", "fields", "nested", "composite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "django>=5.2",
]

[project.urls]
Homepage = "https://github.com/kezabelle/django-nesting-dolls"
Source = "https://github.com/kezabelle/django-nesting-dolls"
Issues = "https://github.com/kezabelle/django-nesting-dolls/issues"

[dependency-groups]
dev = [
    "coverage",
    "django-debug-toolbar",
    "ruff",
    "mypy",
    "django-stubs",
    "twine",
]

[tool.setuptools]
packages = ["nestingdolls"]
include-package-data = false

[tool.setuptools.package-data]
nestingdolls = [
    "py.typed",
    "static/**/*.js",
    "static/**/*.ts",
    "templates/**/*.html",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
strict = true
disallow_any_unimported = true
strict_bytes = true
strict_equality_for_none = true
warn_unreachable = true
warn_unused_configs = true
enable_error_code = ["ignore-without-code"]

[tool.django-stubs]
django_settings_module = "mypy_settings"

[tool.ruff]
required-version = ">=0.16.2"
target-version = "py312"

[tool.ruff.lint]
future-annotations = true
select = ["ALL"]
ignore = [
    "COM812", # Conflicts with the formatter.
    "CPY001", # Copyright notices require a project-wide legal policy.
    "D105", # Magic-method behavior is documented by the containing type.
    "D107", # Constructor behavior is documented by the containing type.
    "D203", # Incompatible with D211.
    "D213", # Incompatible with D212.
    "E501", # The formatter is the authority on line length.
    "EM101", # Django validation errors conventionally use literal messages.
    "SIM110", # An explicit key scan is measurably faster; see AGENTS.md.
    "TRY003", # Django validation errors conventionally carry their message at the raise site.
]

[tool.ruff.lint.per-file-ignores]
# The WSGI demo configures Django before importing its optional debug toolbar.
"demo.py" = ["D", "E402", "S106", "T201"]
# django-stubs reads this configuration module; it has no public runtime API.
"mypy_settings.py" = ["D"]
"nestingdolls/fields.py" = ["PLR0913"] # Django Field-compatible constructors.
"nestingdolls/widgets.py" = ["PLR0913"] # Formset construction mirrors Django's API.
# The benchmark intentionally prints results and instruments a Django private method.
"pathological.py" = ["ANN", "D", "N", "PLR2004", "SLF001", "T201"]
# unittest conventions conflict with pytest-only rules and make test-only annotations/docs redundant.
"test_*.py" = ["ANN", "ARG", "D", "FBT003", "N", "PLR2004", "PT", "S101", "SLF001", "T201"]
