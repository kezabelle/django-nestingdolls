[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-nesting-dolls"
version = "0.1.0"
description = "Composite Django form fields for nested mappings and sequences."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Keryn Knight", email = "keryn@kerynknight.com" }]
keywords = ["django", "forms", "formsets", "fields", "nested", "composite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "django>=5.2",
]

[project.urls]
Homepage = "https://github.com/kezabelle/django-nesting-dolls"
Source = "https://github.com/kezabelle/django-nesting-dolls"
Issues = "https://github.com/kezabelle/django-nesting-dolls/issues"

[dependency-groups]
dev = [
    "coverage",
    "django-debug-toolbar",
    "ruff",
    "mypy",
    "django-stubs",
    "twine",
]

[tool.setuptools]
packages = ["nestingdolls"]
include-package-data = false

[tool.setuptools.package-data]
nestingdolls = [
    "py.typed",
    "static/**/*.js",
    "static/**/*.ts",
    "templates/**/*.html",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
strict = true
warn_unused_configs = true
enable_error_code = ["ignore-without-code"]

[tool.django-stubs]
django_settings_module = "mypy_settings"
