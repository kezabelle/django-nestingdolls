{% spaceless %}
{% if widget.is_hidden %}
  {% for field in widget.hidden_fields %}{{ field }}{% endfor %}
{% else %}
<div
  data-widget="mapping"
  data-mapping-field="{{ widget.name }}"
  {% if widget.attrs.id %}id="{{ widget.attrs.id }}_widget"{% endif %}
>
  <table role="presentation">
    <tbody>
      {{ widget.subform.as_table }}
    </tbody>
  </table>
</div>
{% endif %}
{% endspaceless %}
