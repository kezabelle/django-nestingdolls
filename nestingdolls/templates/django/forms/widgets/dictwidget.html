{% spaceless %}
{% if widget.is_hidden %}
  {% for field in widget.subform %}{{ field.as_hidden }}{% endfor %}
{% else %}
<div
  class=""
  data-mapping-widget
  data-mapping-field="{{ widget.name }}"
  {% if widget.attrs.id %}id="{{ widget.attrs.id }}_widget"{% endif %}
>
  {{ widget.subform }}
</div>
{% endif %}
{% endspaceless %}
