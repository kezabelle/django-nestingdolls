{% spaceless %}
{% if widget.is_hidden %}
  {% for field in widget.hidden_fields %}{{ field }}{% endfor %}
{% else %}
<div
  class=""
  data-widget="mapping"
  data-mapping-field="{{ widget.name }}"
  {% if widget.attrs.id %}id="{{ widget.attrs.id }}_widget"{% endif %}
>
  {{ widget.subform.as_div }}
</div>
{% endif %}
{% endspaceless %}
